name: omniplay
description: "OmniPlay 节点应用：macOS 播放器节点 + Android 控制器/播放器节点。"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

resolution: workspace

dependencies:
  bonsoir: ^7.1.5
  desktop_webview_window: ^0.3.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_libs_android_video: ^1.3.8
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.11
  media_kit_video: ^2.0.1
  mobile_scanner: ^7.4.2
  node_core:
    path: ../../packages/node_core
  node_protocol:
    path: ../../packages/node_protocol
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  sqlite3_flutter_libs: ^0.6.0+eol
  tray_manager: ^0.7.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
