name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: dart analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: false
      - name: Install libsqlite3 (FFI binding for package:sqlite3)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev libsqlite3-0
      - name: pub get (workspace, Flutter SDK required for apps/omniplay flutter_test)
        run: flutter pub get
      - name: analyze
        run: dart analyze packages
      - name: test
        run: dart test --reporter=expanded packages

  web-control:
    name: web_control build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_control
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web_control/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-control-dist
          path: web_control/dist
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omniplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
      - name: pub get (workspace)
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-android-apk
          path: apps/omniplay/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  linux-desktop:
    name: Linux desktop bundle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/omniplay
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libstdc++6 \
            libwebkit2gtk-4.1-dev \
            libjsoncpp-dev \
            libmpv-dev libmpv1
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: pub get (workspace)
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-linux
          path: apps/omniplay/build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    name: Windows desktop bundle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/omniplay
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: pub get (workspace)
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-windows
          path: apps/omniplay/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14
