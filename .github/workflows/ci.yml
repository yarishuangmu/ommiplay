name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dart:
    name: dart analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: false
      - name: Install libsqlite3 (FFI binding for package:sqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev libsqlite3-0
          sudo ldconfig
      - name: pub get (workspace, Flutter SDK required for apps/omniplay flutter_test)
        run: flutter pub get
      - name: analyze
        run: dart analyze packages
      - name: test
        run: dart test --reporter=expanded packages
        env:
          # package:sqlite3 在 Linux CI 上 fallback 到 DynamicLibrary.process()，
          # 但 dartvm 启动时未链接 libsqlite3，符号 sqlite3_initialize 找不到。
          # LD_PRELOAD 把系统 libsqlite3.so.0 注进 dartvm 进程命名空间。
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0

  web-control:
    name: web_control build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_control
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web_control/pnpm-lock.yaml
      - name: install
        run: pnpm install --frozen-lockfile
      - name: build
        run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-control-dist
          path: web_control/dist
          if-no-files-found: error
          retention-days: 7

  android-apk:
    name: Android APK (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/omniplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
      - name: pub get (workspace)
        run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-android-apk
          path: apps/omniplay/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  linux-desktop:
    name: Linux desktop bundle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/omniplay
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libstdc++6 \
            libwebkit2gtk-4.1-dev \
            libjsoncpp-dev \
            libmpv-dev libmpv2
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop
      - name: pub get (workspace)
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-linux
          path: apps/omniplay/build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

  windows-desktop:
    name: Windows desktop bundle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/omniplay
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: pub get (workspace)
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: omniplay-windows
          path: apps/omniplay/build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release (nightly, draft)
    needs: [dart, web-control, android-apk, linux-desktop, windows-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Compute tag metadata
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "datetime=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "commit_msg=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: omniplay-*
          path: artifacts
      - name: Download web-control artifact
        uses: actions/download-artifact@v4
        with:
          name: web-control-dist
          path: artifacts/web-control-dist
      - name: List downloaded artifacts
        run: |
          echo "tree:"
          find artifacts -maxdepth 4 -type d
          echo "---"
          echo "sizes:"
          du -sh artifacts/* 2>&1 | head -20
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.meta.outputs.datetime }}-${{ steps.meta.outputs.short_sha }}
          name: "Nightly ${{ steps.meta.outputs.datetime }} (${{ steps.meta.outputs.short_sha }})"
          body: |
            Nightly build from ${{ github.repository }}@${{ steps.meta.outputs.short_sha }}.

            **Commit:** `${{ steps.meta.outputs.commit_msg }}`
            **Triggered by:** @${{ github.actor }}
            **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            This release is created as a **draft** for manual review before publishing.
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/omniplay-android-apk/**
            artifacts/omniplay-linux/**
            artifacts/omniplay-windows/**
            artifacts/web-control-dist/**
